name: Apple signed release (manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build-only produces an IPA; validate contacts Apple; upload-testflight validates then uploads'
        type: choice
        options: [build-only, validate, upload-testflight]
        default: build-only
        required: true
      runner_image:
        description: 'Official hosted macOS runner; stable Xcode and iPhoneOS SDK are verified at runtime'
        type: choice
        options: [macos-26, macos-15]
        default: macos-26
        required: true
      marketing_version:
        description: 'CFBundleShortVersionString'
        type: string
        default: '1.0.0'
        required: true
      build_number:
        description: 'Unique positive build number; increase after every accepted upload'
        type: string
        default: '1'
        required: true

permissions:
  contents: read
concurrency:
  group: apple-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (inputs.runner_image == 'macos-26' || inputs.runner_image == 'macos-15')
    runs-on: ${{ inputs.runner_image }}
    environment: apple-release
    timeout-minutes: 45
    env:
      APPLE_MARKETING_VERSION: ${{ inputs.marketing_version }}
      APPLE_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: { node-version: '24', cache: npm }
      - name: Select and verify installed stable Xcode and iPhoneOS SDK
        run: bash scripts/apple-sign-export.sh select-xcode
      - run: npm ci
      - run: npm run native:build
      - run: node scripts/verify-native-package.mjs
      - run: npx cap sync ios
      - name: Sign, export and locally verify App Store IPA
        id: sign
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_APP_STORE_PROFILE_BASE64: ${{ secrets.APPLE_APP_STORE_PROFILE_BASE64 }}
        run: bash scripts/apple-sign-export.sh build
      - name: Validate or upload with official Apple tools
        if: inputs.mode != 'build-only'
        env:
          APPLE_RELEASE_MODE: ${{ inputs.mode }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: bash scripts/apple-upload.sh
      - name: Keep only IPA and non-secret verification reports
        if: always() && steps.sign.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: apple-release-${{ inputs.marketing_version }}-${{ inputs.build_number }}
          path: |
            output/apple-release/IslandTransport.ipa
            output/apple-release/verification.json
            output/apple-release/platform-result.json
          if-no-files-found: ignore
          retention-days: 14
